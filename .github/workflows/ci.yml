name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: python3 scripts/check-contract.py
      - run: python3 scripts/test-tui-pty.py
      - run: cargo build --release --locked
      - name: CLI smoke test (read-only)
        if: runner.os == 'macOS'
        run: scripts/smoke-cli.sh
  native-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test native application
        run: ./scripts/build-macos.sh
      - name: Read-only native diagnostics
        run: ./target/release/macora doctor
      - name: Preserve app bundle permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/Macora.app dist/Macora-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Macora-macOS-build
          path: dist/Macora-macOS.zip
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.74'
      - run: cargo test --locked
